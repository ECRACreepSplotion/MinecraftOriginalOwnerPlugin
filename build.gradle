plugins {
    id 'java'
}

group = 'com.kodari'
version = '5.4.0-26.3'

repositories {
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
    implementation 'com.github.cryptomorin:XSeries:14.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
